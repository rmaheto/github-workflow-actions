name: Test S3 OIDC

on:
  push:
    branches:
      - feature/copy-operation

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify assumed identity
        run: aws sts get-caller-identity

      - name: Verify source bucket access
        run: |
          aws s3 ls s3://transfer-source-dev-2026/

      - name: Test S3 copy
        run: |
          aws s3 cp \
            "s3://transfer-source-dev-2026/Study Leave Approval.pdf" \
            "s3://transfer-landing-bucket-dev/Study Leave Approval.pdf"