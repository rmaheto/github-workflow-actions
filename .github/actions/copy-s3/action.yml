name: Copy S3 objects
description: Validate inputs and copy S3 objects using AWS OIDC and TypeScript
inputs:
  source_bucket:
    description: Source bucket name
    required: true
  destination_bucket:
    description: Destination bucket name
    required: true
  recursive:
    description: Whether to copy all objects under the source prefix
    default: "false"
  source_key:
    description: Source object key or prefix
    default: ""
  destination_key:
    description: Destination object key or prefix
    default: ""
  role_arn:
    description: IAM role ARN for GitHub OIDC authentication
    required: true
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "24"
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Type-check operation scripts
      shell: bash
      run: npm run build

    - name: Validate inputs
      shell: bash
      run: node scripts/s3/copy.ts --validate-only
      env:
        SOURCE_BUCKET: ${{ inputs.source_bucket }}
        DESTINATION_BUCKET: ${{ inputs.destination_bucket }}
        SOURCE_KEY: ${{ inputs.source_key }}
        DESTINATION_KEY: ${{ inputs.destination_key }}
        RECURSIVE: ${{ inputs.recursive }}

    - name: Assume AWS role using OIDC
      uses: aws-actions/configure-aws-credentials@v6.3.0
      with:
        role-to-assume: ${{ inputs.role_arn }}
        aws-region: us-east-1
        role-session-name: github-s3-copy-${{ github.run_id }}
        role-duration-seconds: 3600

    - name: Copy objects
      shell: bash
      run: node scripts/s3/copy.ts
      env:
        SOURCE_BUCKET: ${{ inputs.source_bucket }}
        DESTINATION_BUCKET: ${{ inputs.destination_bucket }}
        SOURCE_KEY: ${{ inputs.source_key }}
        DESTINATION_KEY: ${{ inputs.destination_key }}
        RECURSIVE: ${{ inputs.recursive }}
